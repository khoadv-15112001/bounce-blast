<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bounce Prototype</title>
<style>
  :root{
    --bg:#0f1830; --panel:#16223f; --ink:#eaf0ff; --muted:#9fb0d6;
    --accent:#4dd4ff; --ball:#ffd54d; --danger:#ff6b8a; --pickup:#74f7a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 120% at 50% 0%,#1a2748 0%,var(--bg) 60%);
    color:var(--ink); font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;
    display:flex; flex-direction:column; align-items:center; min-height:100%;
    padding:10px; gap:8px; -webkit-user-select:none; user-select:none;
  }
  h1{font-size:17px;margin:2px 0 0;letter-spacing:.5px}
  .hud{display:flex;gap:8px;width:100%;max-width:440px}
  .chip{flex:1;background:var(--panel);border:1px solid #243357;border-radius:12px;
    padding:6px 8px;text-align:center}
  .chip b{display:block;font-size:19px}
  .chip span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  #wrap{position:relative;width:100%;max-width:440px}
  canvas{width:100%;height:auto;display:block;background:var(--panel);
    border:1px solid #243357;border-radius:16px;touch-action:none}
  #msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:rgba(9,15,30,.8);border-radius:16px;text-align:center}
  #msg h2{margin:0;font-size:26px}
  #msg p{margin:0;color:var(--muted)}
  button{background:var(--accent);color:#07233a;border:0;border-radius:10px;
    padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer}
  .hint{color:var(--muted);font-size:12.5px;max-width:440px;text-align:center}
</style>
</head>
<body>
  <h1>BOUNCE PROTOTYPE</h1>
  <div class="hud">
    <div class="chip"><b id="lvl">1</b><span>Level</span></div>
    <div class="chip"><b id="balls">3</b><span>Bóng</span></div>
    <div class="chip"><b id="blocks">0</b><span>Khối</span></div>
  </div>
  <div id="wrap">
    <canvas id="c" width="440" height="660"></canvas>
    <div id="msg"><h2 id="msgTitle">—</h2><p id="msgSub"></p><button id="again">Chơi lại</button></div>
  </div>
  <div class="hint">Kéo để ngắm (hướng lên), thả để bắn cả băng bóng. Bóng nảy tường, phá khối rồi gom về điểm rơi. Mỗi lượt khối tụt xuống — đừng để chạm vạch đỏ.</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const el = id => document.getElementById(id);
  const ui = { lvl: el('lvl'), balls: el('balls'), blocks: el('blocks') };
  const overlay = el('msg'), msgTitle = el('msgTitle'), msgSub = el('msgSub');

  const COLS = 7;
  const PAD = 14;
  const CELL = (W - PAD*2) / COLS;
  const TOP = 64;                         // first row y
  const BALL_R = 8;
  const SPEED = 11;
  const LAUNCH_Y = H - 30;
  const FLOOR_Y = LAUNCH_Y - 4;           // balls returning cross this
  const DANGER_ROWS = 10;                 // block reaching this row index = lose
  const DANGER_Y = TOP + DANGER_ROWS*CELL;

  let state;
  const rngOf = seed => { let s=seed>>>0; return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296; };

  function buildLevel(level, ballCount){
    const rand = rngOf(1000 + level*7);
    const blocks = [], pickups = [];
    const rows = Math.min(3 + Math.floor(level/2), 5);
    for(let r=0;r<rows;r++){
      for(let col=0; col<COLS; col++){
        const v = rand();
        if(v < 0.5){
          const hp = 1 + Math.floor(rand()*(2+level));
          blocks.push({ col, row:r, hp, max:hp });
        } else if(v < 0.56){
          pickups.push({ col, row:r, taken:false });
        }
      }
    }
    if(blocks.length===0) blocks.push({col:3,row:1,hp:2,max:2});
    state = {
      level, ballCount, blocks, pickups,
      launchX: W/2, descent: 0,
      phase:'aim',                        // aim | shoot | resolve | over
      aimTo:{x:W/2,y:LAUNCH_Y-120},
      balls:[], toFire:0, fired:0, returned:0, nextX:null, gain:0,
    };
    syncHud();
  }

  const actualRow = r => r + state.descent;
  function blockRect(b){
    return { x: PAD + b.col*CELL+2, y: TOP + actualRow(b.row)*CELL+2, w: CELL-4, h: CELL-4 };
  }
  function pickupPos(p){
    return { x: PAD + p.col*CELL + CELL/2, y: TOP + actualRow(p.row)*CELL + CELL/2 };
  }
  function hpColor(b){
    const t = b.hp/b.max;
    return `rgb(${Math.round(120+(1-t)*135)},${Math.round(90+t*120)},150)`;
  }

  // ---------- input ----------
  function pos(e){
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)*(W/r.width), y:(p.clientY-r.top)*(H/r.height) };
  }
  function startAim(e){ if(state.phase!=='aim') return; state.aiming=true; e.preventDefault(); }
  function moveAim(e){ if(!state.aiming) return; state.aimTo=pos(e); e.preventDefault(); }
  function endAim(e){
    if(!state.aiming) return; state.aiming=false;
    const dir = aimDir();
    if(dir) fire(dir.x, dir.y);
    e.preventDefault();
  }
  function aimDir(){
    const from={x:state.launchX,y:LAUNCH_Y};
    let dx=from.x-state.aimTo.x, dy=from.y-state.aimTo.y;
    const len=Math.hypot(dx,dy);
    if(len<14 || dy<=0) return null;      // must drag upward
    return { x:dx/len, y:dy/len };
  }
  cv.addEventListener('mousedown',startAim); cv.addEventListener('mousemove',moveAim);
  window.addEventListener('mouseup',endAim);
  cv.addEventListener('touchstart',startAim,{passive:false});
  cv.addEventListener('touchmove',moveAim,{passive:false});
  cv.addEventListener('touchend',endAim,{passive:false});

  function fire(dx,dy){
    state.phase='shoot';
    state.toFire=state.ballCount; state.fired=0; state.returned=0;
    state.nextX=null; state.gain=0; state.dir={x:dx,y:dy};
  }

  // ---------- simulation ----------
  let fireTick=0;
  function spawnBalls(){
    if(state.phase!=='shoot' || state.fired>=state.toFire) return;
    fireTick++;
    if(fireTick % 5 === 0){                // ~1 ball every 5 frames
      state.balls.push({ x:state.launchX, y:LAUNCH_Y, vx:state.dir.x*SPEED, vy:state.dir.y*SPEED });
      state.fired++;
    }
  }

  function step(){
    if(state.phase==='shoot') spawnBalls();

    for(const ball of state.balls){
      if(ball.done) continue;
      ball.x+=ball.vx; ball.y+=ball.vy;
      if(ball.x<BALL_R){ ball.x=BALL_R; ball.vx*=-1; }
      if(ball.x>W-BALL_R){ ball.x=W-BALL_R; ball.vx*=-1; }
      if(ball.y<TOP-46+BALL_R){ ball.y=TOP-46+BALL_R; ball.vy*=-1; }

      // pickups
      for(const p of state.pickups){
        if(p.taken) continue;
        const pp=pickupPos(p), d=Math.hypot(ball.x-pp.x,ball.y-pp.y);
        if(d < BALL_R+10){ p.taken=true; state.gain++; }
      }
      // blocks
      for(const b of state.blocks){
        if(b.hp<=0) continue;
        const r=blockRect(b);
        const cx=Math.max(r.x,Math.min(ball.x,r.x+r.w));
        const cy=Math.max(r.y,Math.min(ball.y,r.y+r.h));
        const ddx=ball.x-cx, ddy=ball.y-cy;
        if(ddx*ddx+ddy*ddy <= BALL_R*BALL_R){
          b.hp--;
          const ox=Math.min(ball.x-r.x,r.x+r.w-ball.x);
          const oy=Math.min(ball.y-r.y,r.y+r.h-ball.y);
          if(ox<oy) ball.vx*=-1; else ball.vy*=-1;
          break;
        }
      }
      // returned to floor
      if(ball.y>FLOOR_Y){
        ball.done=true; state.returned++;
        if(state.nextX===null) state.nextX=Math.max(BALL_R,Math.min(W-BALL_R,ball.x));
      }
    }
    state.blocks=state.blocks.filter(b=>b.hp>0);
    state.balls=state.balls.filter(b=>!b.done);

    if(state.phase==='shoot' && state.fired>=state.toFire && state.balls.length===0){
      endTurn();
    }
  }

  function endTurn(){
    state.launchX = state.nextX ?? state.launchX;
    state.ballCount += state.gain;
    if(state.blocks.length===0){ return end(true); }
    state.descent++;
    // lose if any block crossed danger line
    const hitBottom = state.blocks.some(b => actualRow(b.row) >= DANGER_ROWS);
    if(hitBottom){ return end(false); }
    state.phase='aim';
    syncHud();
  }

  function end(win){
    state.phase='over';
    msgTitle.textContent = win ? 'THẮNG!' : 'THUA';
    msgSub.textContent = win ? 'Qua màn tiếp theo' : 'Khối đã chạm đáy';
    el('again').textContent = win ? 'Màn tiếp →' : 'Chơi lại';
    overlay.dataset.win = win?'1':'0';
    overlay.style.display='flex';
  }
  el('again').addEventListener('click',()=>{
    overlay.style.display='none';
    const win = overlay.dataset.win==='1';
    if(win) buildLevel(state.level+1, state.ballCount);
    else    buildLevel(state.level, 3);
  });

  function syncHud(){
    ui.lvl.textContent=state.level;
    ui.balls.textContent=state.ballCount;
    ui.blocks.textContent=state.blocks.length;
  }

  // ---------- render ----------
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='#2c3a63'; ctx.lineWidth=2;
    ctx.strokeRect(2, TOP-46, W-4, H-TOP+36);

    // danger line
    ctx.strokeStyle='rgba(255,107,138,.55)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(4,DANGER_Y); ctx.lineTo(W-4,DANGER_Y); ctx.stroke();
    ctx.setLineDash([]);

    for(const b of state.blocks){
      const r=blockRect(b);
      ctx.fillStyle=hpColor(b); roundRect(r.x,r.y,r.w,r.h,6); ctx.fill();
      ctx.fillStyle='#0c1630'; ctx.font='bold 15px system-ui';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.hp, r.x+r.w/2, r.y+r.h/2);
    }
    for(const p of state.pickups){
      if(p.taken) continue;
      const pp=pickupPos(p);
      ctx.fillStyle='#74f7a0';
      ctx.beginPath();
      ctx.moveTo(pp.x,pp.y-9); ctx.lineTo(pp.x+9,pp.y); ctx.lineTo(pp.x,pp.y+9); ctx.lineTo(pp.x-9,pp.y);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#07321a'; ctx.font='bold 11px system-ui';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('+1',pp.x,pp.y+1);
    }

    // launcher
    ctx.fillStyle='#243357'; roundRect(state.launchX-22,LAUNCH_Y+6,44,8,4); ctx.fill();

    if(state.phase==='aim' && state.aiming){
      const d=aimDir();
      if(d) drawGuide(state.launchX,LAUNCH_Y,d.x,d.y);
    }
    for(const b of state.balls){
      ctx.fillStyle='#ffd54d'; ctx.beginPath(); ctx.arc(b.x,b.y,BALL_R,0,7); ctx.fill();
    }
    if(state.phase==='aim'){
      ctx.fillStyle='#ffd54d'; ctx.beginPath(); ctx.arc(state.launchX,LAUNCH_Y,BALL_R,0,7); ctx.fill();
    }
  }

  function drawGuide(x,y,dx,dy){
    let px=x,py=y,vx=dx*SPEED,vy=dy*SPEED;
    ctx.fillStyle='rgba(77,212,255,.6)';
    for(let i=0;i<60;i++){
      px+=vx; py+=vy;
      if(px<BALL_R||px>W-BALL_R) vx*=-1;
      if(py<TOP-46+BALL_R) vy*=-1;
      if(py>FLOOR_Y) break;
      if(i%4===0){ ctx.beginPath(); ctx.arc(px,py,2.3,0,7); ctx.fill(); }
    }
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  function loop(){ if(state && state.phase!=='over'){ step(); } if(state){ draw(); syncHud(); } requestAnimationFrame(loop); }

  buildLevel(1, 3);
  loop();
})();
</script>
</body>
</html>
